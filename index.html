<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Household Chore Tracker</title>
<style>
:root{font-family:system-ui,sans-serif;color:#203044;background:#f4f7fb}body{margin:0}header{background:#173b49;color:white;padding:25px 18px}header h1{margin:0}main{max-width:850px;margin:auto;padding:16px}.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #1232}nav{display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit}button{border:0;border-radius:9px;padding:10px 13px;background:#dce9ee;cursor:pointer}.active{background:#087d78;color:white}.task{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #ddd}.task input{width:20px;height:20px}small{color:#526678}.done{text-decoration:line-through;color:#70818a}footer{padding:15px;text-align:center}
.calendar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px}.calendar-toolbar h2{font-size:1.2rem;text-align:center}.calendar-toolbar button{font-size:1.5rem}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.calendar-head{text-align:center;font-size:.75rem;font-weight:700;padding:8px 0}.calendar-day{min-width:0;min-height:65px;background:#edf4f5;padding:5px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:5px}.calendar-day small{font-size:.58rem;line-height:1.4;white-space:normal}.calendar-day.selected{background:#087d78;color:white}.calendar-day.is-today{outline:2px solid #e7a52e;outline-offset:-2px}@media(max-width:450px){.calendar-day{min-height:58px}.calendar-day small{font-size:.53rem}.card{padding:12px}}
.identity-overlay{position:fixed;inset:0;background:#112c39ee;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px}.identity-panel{background:white;border-radius:20px;padding:25px;width:min(100%,440px);box-sizing:border-box;text-align:center}.identity-panel select{width:100%;font:inherit;padding:12px;margin:12px 0;border:1px solid #a8b9c0;border-radius:10px}.identity-panel button{width:100%;background:#087d78;color:white}.identity-panel button:disabled{opacity:.5}.identity-banner{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;color:#fff}.identity-banner button{font-size:.85rem}
</style><header><h1>🏡 Household Chore Tracker</h1><p>Daily dishes · Laundry · Cleaning areas</p></header><div id="identity" class="identity-overlay" hidden></div><main><div id="identity-banner" class="identity-banner"></div><nav id="tabs"></nav><section id="content"></section></main><footer>Version 1.7.0 · Progress is saved on this device. Review assignments against the handwritten original.</footer>
<script>
const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const dishes=['Natalie','Wyatt','Kaedyn','Greyson','Rhyan','Logan','Trystan'];
const laundry=[
['Myk','Friday night / Saturday morning; one load of towels'],
['Natalie','Saturday afternoon / Sunday; Sunday linens'],
['Kaedyn','Monday; linens and one load of towels'],
['Trystan','Friday morning / day'],
['Wyatt','Tuesday; one load of towels and mats'],
['Smalls','Thursday; dog stuff'],
['Greyson','Wednesday; one load of towels']
];
const areas=[
['Kaedyn & Wyatt','Bedroom, office, hallway, downstairs bathroom'],
['Rhyan','Back room / family room; room (Smalls)'],
['Trystan','Garage, recycling, bedroom (other handwriting unclear)'],
['Greyson','Bedroom, upstairs bathroom, hallway, downstairs side bathroom'],
['Rhyan & Logan','Dining room'],
['Myk','Kitchen, garage, outside deck'],
['Natalie','Bathroom, laundry, hall, mud room']
];
const members=['Logan','Natalie','Wyatt','Kaedyn','Greyson','Rhyan','Trystan','Myk','Smalls'];
let currentUser=localStorage.getItem('chore-current-user')||'';
let loganUnlocked=false;
let tab='Today';const tabs=['Today','Calendar','Dishes','Laundry','Cleaning','Progress'];
let calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1),selectedDate=new Date();
function week(d=new Date()){let s=new Date(d.getFullYear(),d.getMonth(),d.getDate());s.setDate(s.getDate()-s.getDay());return dateKey(s)}
function laundryDays(i){return i===0?['Friday','Saturday']:i===1?['Saturday','Sunday']:[['Friday','Saturday'],['Saturday','Sunday'],['Monday'],['Friday'],['Tuesday'],['Thursday'],['Wednesday']][i]}
function taskDays(t){return t.days|| (t.day?[t.day]:[])}
function tasks(){return [
...days.map((day,i)=>({id:'dish'+i,day,person:dishes[i],name:'Wash dishes'})),
...laundry.map(([person,name],i)=>({id:'laundry'+i,person,name,day:laundryDays(i)[0],days:laundryDays(i)})),
...areas.map(([person,name],i)=>({id:'area'+i,person,name,day:''}))
]}
const key=(d=new Date())=>'chore-checks-'+week(d);
function checks(d=new Date()){try{return JSON.parse(localStorage.getItem(key(d))||'{}')}catch{return {}}}
function mark(id,v){let d=tab==='Calendar'?selectedDate:new Date(),c=checks(d);if(v)c[id]={by:currentUser,at:new Date().toISOString()};else delete c[id];localStorage.setItem(key(d),JSON.stringify(c));render()}
function taskHTML(t,d=new Date()){let c=checks(d);return '<label class="task"><input type="checkbox" data-id="'+t.id+'" '+(c[t.id]?'checked':'')+'><span class="'+(c[t.id]?'done':'')+'"><strong>'+escapeHTML(t.person)+'</strong> — '+escapeHTML(t.name)+(t.day?' <small>('+escapeHTML(t.day)+')</small>':'')+(c[t.id]?'<small> · Checked off by '+escapeHTML(typeof c[t.id]==='object'?c[t.id].by:'Unknown (older checkmark)')+'</small>':'')+'</span></label>'}
function section(title,items,empty,d=new Date()){return '<div class="card"><h2>'+title+'</h2>'+(items.length?items.map(t=>taskHTML(t,d)).join(''):'<p><small>'+empty+'</small></p>')+'</div>'}
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function calendarView(all){
const y=calendarMonth.getFullYear(),m=calendarMonth.getMonth(),first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate();
let grid='<div class="calendar-grid">'+days.map(d=>'<div class="calendar-head">'+d.slice(0,3)+'</div>').join('');
for(let i=0;i<first;i++)grid+='<div></div>';
for(let n=1;n<=count;n++){
let d=new Date(y,m,n),day=d.getDay(),k=dateKey(d),selected=k===dateKey(selectedDate),isToday=k===dateKey(new Date());
let dayTasks=all.filter(t=>taskDays(t).includes(days[day])||(day===6&&t.id.startsWith('area')));
grid+='<button class="calendar-day '+(selected?'selected ':'')+(isToday?'is-today':'')+'" data-date="'+k+'"><strong>'+n+'</strong><small>'+dayTasks.filter(t=>t.id.startsWith('dish')).length+' 🍽️ '+dayTasks.filter(t=>t.id.startsWith('laundry')).length+' 🧺'+(day===6?' 🧹':'')+'</small></button>';
}
grid+='</div>';
let selectedDay=days[selectedDate.getDay()],selectedTasks=all.filter(t=>taskDays(t).includes(selectedDay)||(selectedDate.getDay()===6&&t.id.startsWith('area')));
return '<div class="card"><div class="calendar-toolbar"><button data-month="-1" aria-label="Previous month">‹</button><h2>'+calendarMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</h2><button data-month="1" aria-label="Next month">›</button></div>'+grid+'<p><small>🍽️ Dishes · 🧺 Laundry · 🧹 Weekly cleaning deadline · Selected week: '+week(selectedDate)+'</small></p></div>'+section('📅 '+selectedDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}),selectedTasks,'No scheduled chores',selectedDate);
}
function showIdentity(){
const overlay=document.getElementById('identity');overlay.hidden=false;overlay.style.display='flex';
overlay.innerHTML='<div class="identity-panel"><h2>👋 Who is checking in?</h2><p>Choose your name to open the household chore tracker.</p><select id="member-select"><option value="">Select your name</option>'+members.map(n=>'<option value="'+n+'">'+n+'</option>').join('')+'</select><div id="logan-password" hidden><label for="admin-pin">Logan access code</label><input id="admin-pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="Enter 4-digit code" style="width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:1px solid #a8b9c0;border-radius:10px"></div><p id="identity-error" role="alert" style="color:#a32020"></p><button id="enter-app" disabled>Continue</button><p><small>Your name is remembered on this device. This is a basic access screen, not secure authentication.</small></p></div>';
let select=document.getElementById('member-select'),button=document.getElementById('enter-app');
select.onchange=()=>{button.disabled=!select.value;document.getElementById('logan-password').hidden=select.value!=='Logan';document.getElementById('identity-error').textContent=''};
button.onclick=()=>{if(!select.value)return;
if(select.value==='Logan'&&document.getElementById('admin-pin').value!=='0118'){document.getElementById('identity-error').textContent='Incorrect access code';return}
loganUnlocked=select.value==='Logan';currentUser=select.value;
localStorage.setItem('chore-current-user',currentUser);overlay.hidden=true;overlay.style.display='none';tab='Today';render()};
}
let monitorState={last:null,history:[],runs:0};
function auditApp(){
const results=[],add=(name,ok,detail)=>results.push({name,ok,detail});
let all=[],stored={};
try{all=tasks();add('Chore data loads',Array.isArray(all)&&all.length>0,all.length+' assignments found')}catch(e){add('Chore data loads',false,String(e))}
add('Unique task identifiers',new Set(all.map(t=>t.id)).size===all.length,'Prevents checkboxes sharing the same saved state');
add('Daily dishes coverage',days.every(d=>all.filter(t=>t.id.startsWith('dish')&&t.day===d).length===1),'One dish assignment per day');
add('Laundry assignments',laundry.length===7&&laundry.every(x=>x[0]&&x[1]),laundry.length+' laundry assignments configured');
add('Cleaning assignments',areas.length>0&&areas.every(x=>x[0]&&x[1]),areas.length+' cleaning assignments configured');
add('Family name mapping',all.every(t=>t.person.split(' & ').every(n=>members.includes(n))), 'Checks that assigned names exist in the selector');
add('Calendar date calculations',[0,1,2,3,4,5,6].every(i=>days[new Date(2026,10,15+i).getDay()]===days[i]),'Validates weekday mapping');
try{let probe='chore-monitor-probe';localStorage.setItem(probe,'ok');let ok=localStorage.getItem(probe)==='ok';localStorage.removeItem(probe);add('Device storage write/read',ok,'Tests whether local progress can be saved')}catch(e){add('Device storage write/read',false,'Storage unavailable: '+e.message)}
try{stored=checks();add('Saved checkmarks format',stored&&typeof stored==='object'&&!Array.isArray(stored),'Saved weekly progress is readable')}catch(e){add('Saved checkmarks format',false,String(e))}
add('No unknown saved tasks',Object.keys(stored).every(id=>all.some(t=>t.id===id)),'Detects obsolete or mismatched saved IDs');
add('Multi-day laundry coverage',taskDays(all.find(t=>t.id==='laundry0')).includes('Saturday')&&taskDays(all.find(t=>t.id==='laundry1')).includes('Sunday'),'Checks weekend laundry assignments');
add('Calendar week separation',key(new Date(2026,10,15))!==key(new Date(2026,10,22)),'Different calendar weeks have separate saved checkmarks');
add('Navigation tabs present',tabs.includes('Today')&&tabs.includes('Calendar')&&tabs.includes('Progress'),'Checks main navigation configuration');
add('Admin access state',currentUser==='Logan'&&loganUnlocked,'Admin monitor only runs after Logan PIN entry');
const suggestions=[];
const overdue=all.filter(t=>taskDays(t).length&&taskDays(t).every(d=>days.indexOf(d)<new Date().getDay())&&!stored[t.id]).length;
if(overdue)suggestions.push(overdue+' earlier scheduled chore(s) are still unchecked. Consider an overdue summary.');
if(!navigator.onLine)suggestions.push('Device appears offline. Changes will stay on this device only.');
suggestions.push('Progress does not sync between family devices. Add a shared database for household-wide updates.');
suggestions.push('The PIN is stored in public browser code. Use server-side authentication for real admin privacy.');
suggestions.push('Multi-day laundry assignments now appear on both scheduled days. Consider setting exact start and end times.');
suggestions.push('Calendar now saves progress by selected week. Individual daily completion history would require separate per-day records.');
let time=new Date(),report={time:time.toLocaleTimeString(),timestamp:time.toISOString(),results,suggestions,passed:results.filter(x=>x.ok).length,failed:results.filter(x=>!x.ok).length};
monitorState.last=report;monitorState.runs++;
monitorState.history.unshift({time:report.time,passed:report.passed,failed:report.failed});
monitorState.history=monitorState.history.slice(0,12);
return report;
}
function monitorView(){
let r=monitorState.last||auditApp();
return '<div class="card"><h2>🧠 Live App Monitor</h2><p><strong>Monitoring while this app is open</strong> · Automated checks every 30 seconds</p><p><strong>'+r.passed+' passed · '+r.failed+' flagged</strong> out of '+r.results.length+' checks</p><p><small>Last scan: '+escapeHTML(r.time)+' · Scans this session: '+monitorState.runs+'</small></p><button id="scan-now">Run checks now</button></div>'+
'<div class="card"><h2>Function checks</h2>'+r.results.map(x=>'<div class="task"><span>'+(x.ok?'✅':'⚠️')+' <strong>'+escapeHTML(x.name)+'</strong><div><small>'+escapeHTML(x.detail)+'</small></div></span></div>').join('')+'</div>'+
'<div class="card"><h2>💡 Improvement suggestions</h2>'+r.suggestions.map(x=>'<p>• '+escapeHTML(x)+'</p>').join('')+'</div>'+
'<div class="card"><h2>Recent live scans</h2>'+monitorState.history.map(x=>'<div class="task"><small>'+escapeHTML(x.time)+' — '+x.passed+' passed, '+x.failed+' flagged</small></div>').join('')+'</div>'+
'<div class="card"><small>This is a local automated diagnostics engine, not a cloud AI model. It checks known invariants without modifying chores or GitHub. It cannot test every possible interaction, detect every bug, or keep running after the browser closes.</small></div>';
}
function refreshMonitor(){
if(tab==='Logan Only'&&loganUnlocked&&currentUser==='Logan'){
auditApp();const el=document.getElementById('monitor-area');if(el)el.innerHTML=monitorView();
const b=document.getElementById('scan-now');if(b)b.onclick=refreshMonitor;
}}
setInterval(()=>{if(tab==='Logan Only'&&loganUnlocked&&currentUser==='Logan')refreshMonitor()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tab==='Logan Only'&&loganUnlocked&&currentUser==='Logan')refreshMonitor()});
function adminView(all){
let c=checks(),people=members.map(n=>({name:n,assigned:all.filter(t=>t.person.split(' & ').includes(n)),completed:all.filter(t=>t.person.split(' & ').includes(n)&&c[t.id])}));
return '<div class="card"><h2>🔒 Logan’s private dashboard</h2><p>Household overview for the current week.</p><p><small>This page is hidden behind a basic PIN screen, but GitHub Pages cannot provide real security for client-side passwords.</small></p></div><div class="card"><h2>Family chore progress</h2>'+people.map(p=>'<div class="task"><span><strong>'+escapeHTML(p.name)+'</strong> — '+p.completed.length+' of '+p.assigned.length+' assignments completed</span></div>').join('')+'</div>'+section('All weekly assignments',all,'No assignments')+'<div id="monitor-area">'+monitorView()+'</div>';
}
function render(){
document.getElementById('identity-banner').innerHTML='<span>👤 Viewing as <strong>'+escapeHTML(currentUser)+'</strong></span><button id="switch-member">Switch name</button>';
document.getElementById('switch-member').onclick=()=>{loganUnlocked=false;showIdentity()};
if(tab==='Logan Only'&&!(currentUser==='Logan'&&loganUnlocked))tab='Today';
let visibleTabs=currentUser==='Logan'&&loganUnlocked?[...tabs,'Logan Only']:tabs;
document.getElementById('tabs').innerHTML=visibleTabs.map(t=>'<button class="'+(tab===t?'active':'')+'" data-tab="'+t+'">'+t+'</button>').join('');
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
let all=tasks(),now=new Date(),dayIndex=now.getDay(),today=days[dayIndex],c=checks(),done=all.filter(t=>c[t.id]).length;
let summary='<div class="card"><h2>'+(tab==='Today'?today+' · Your chore dashboard':tab==='Progress'?'Weekly progress':tab)+'</h2><p><strong>'+done+' / '+all.length+'</strong> chores completed this week</p><progress value="'+done+'" max="'+all.length+'" style="width:100%"></progress><p><small>Week beginning '+week()+' · Weekly deadline: Saturday</small></p></div>';
let html=summary;
if(tab==='Logan Only'&&currentUser==='Logan'&&loganUnlocked){html=adminView(all)}else if(tab==='Calendar'){html=calendarView(all)}else if(tab==='Today'){
let due=all.filter(t=>taskDays(t).includes(today));
let upcoming=all.filter(t=>t.id.startsWith('laundry')&&taskDays(t).some(d=>days.indexOf(d)>dayIndex)&&!c[t.id]);
let overdue=all.filter(t=>taskDays(t).length&&taskDays(t).every(d=>days.indexOf(d)<dayIndex)&&!c[t.id]);
let weekly=all.filter(t=>t.id.startsWith('area')&&!c[t.id]);
html+=section('📌 Due today',due,'No scheduled dishes or laundry today');
html+=section('🧺 Upcoming laundry this week',upcoming,'No more scheduled laundry this week');
html+=section('⚠️ Earlier scheduled chores still unfinished',overdue,'Nothing overdue');
html+=section('🧹 Cleaning due by Saturday',weekly,'All weekly cleaning assignments completed');
}else{
let filtered=tab==='Dishes'?all.filter(t=>t.id.startsWith('dish')):tab==='Laundry'?all.filter(t=>t.id.startsWith('laundry')):tab==='Cleaning'?all.filter(t=>t.id.startsWith('area')):all;
html+=section(tab==='Progress'?'All weekly chores':'Assignments',filtered,'No chores');
}
document.getElementById('content').innerHTML=html;
document.querySelectorAll('[data-id]').forEach(x=>x.onchange=()=>mark(x.dataset.id,x.checked));
const scanButton=document.getElementById('scan-now');if(scanButton)scanButton.onclick=refreshMonitor;
document.querySelectorAll('[data-month]').forEach(x=>x.onclick=()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+Number(x.dataset.month),1);selectedDate=new Date(calendarMonth);render()});
document.querySelectorAll('[data-date]').forEach(x=>x.onclick=()=>{let [y,m,d]=x.dataset.date.split('-').map(Number);selectedDate=new Date(y,m-1,d);render()});
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
if(currentUser&&members.includes(currentUser)&&currentUser!=='Logan'){render()}else{showIdentity()}
</script></html>
