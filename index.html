<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Household Chore Tracker</title>
<style>
:root{font-family:system-ui,sans-serif;color:#203044;background:#f4f7fb}body{margin:0}header{background:#173b49;color:white;padding:25px 18px}header h1{margin:0}main{max-width:850px;margin:auto;padding:16px}.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #1232}nav{display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit}button{border:0;border-radius:9px;padding:10px 13px;background:#dce9ee;cursor:pointer}.active{background:#087d78;color:white}.task{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #ddd}.task input{width:20px;height:20px}small{color:#526678}.done{text-decoration:line-through;color:#70818a}footer{padding:15px;text-align:center}
.calendar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px}.calendar-toolbar h2{font-size:1.2rem;text-align:center}.calendar-toolbar button{font-size:1.5rem}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.calendar-head{text-align:center;font-size:.75rem;font-weight:700;padding:8px 0}.calendar-day{min-width:0;min-height:65px;background:#edf4f5;padding:5px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:5px}.calendar-day small{font-size:.58rem;line-height:1.4;white-space:normal}.calendar-day.selected{background:#087d78;color:white}.calendar-day.is-today{outline:2px solid #e7a52e;outline-offset:-2px}@media(max-width:450px){.calendar-day{min-height:58px}.calendar-day small{font-size:.53rem}.card{padding:12px}}
.identity-overlay[hidden]{display:none!important}.identity-overlay{position:fixed;inset:0;background:#112c39ee;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px}.identity-panel{background:white;border-radius:20px;padding:25px;width:min(100%,440px);box-sizing:border-box;text-align:center}.identity-panel select{width:100%;font:inherit;padding:12px;margin:12px 0;border:1px solid #a8b9c0;border-radius:10px}.identity-panel button{width:100%;background:#087d78;color:white}.identity-panel button:disabled{opacity:.5}.identity-banner{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;color:#fff}.identity-banner button{font-size:.85rem}
.identity-banner{color:#173b49!important;background:#e0ebee;border-radius:12px;padding:10px 12px;margin:12px 0}.identity-banner strong{color:#173b49}.identity-banner button{background:#c3dce3;color:#123c51;font-weight:700}nav button{color:#173b49;font-weight:650}nav button.active{color:#fff;background:#087d78}.task-details{display:flex;flex-direction:column;gap:5px;min-width:0;line-height:1.4}.completion-credit{display:block;font-size:.88rem;color:#075d48;font-weight:600;text-decoration:none!important}.completion-credit strong{color:#075d48}.task .done{color:#63717d}.task input{flex-shrink:0;accent-color:#087d78}.card{color:#203044}
.card select,.card input[type="number"],.card input[type="text"],#bonus-reason{display:block;box-sizing:border-box;width:100%;padding:12px;margin:7px 0 15px;border:1px solid #9caeb8;border-radius:9px;font:inherit}.card label{font-weight:650}#award-bonus{background:#087d78;color:white;font-weight:700}
.point-form .point-field{display:flex;flex-direction:column;align-items:stretch;gap:8px;margin:20px 0}.point-form .point-field label{display:block;font-weight:700;margin:0}.point-form .point-field input,.point-form .point-field select{display:block;width:100%;min-width:0;box-sizing:border-box;padding:12px;border:1px solid #a8b9c0;border-radius:10px;font:inherit;background:#fff;color:#203045}.point-form .point-field select{background:#e9edf0}.point-form button{display:inline-block;margin-top:8px}
</style><header><h1>🏡 Household Chore Tracker</h1><p>Daily dishes · Laundry · Cleaning areas</p></header><div id="identity" class="identity-overlay" hidden></div><main><div id="identity-banner" class="identity-banner"></div><nav id="tabs"></nav><section id="content"></section></main><footer>Version 2.4 · Improved point forms and save confirmations · Cloud sync when connected. Review assignments against the handwritten original.</footer>
<script>
const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const dishes=['Natalie','Wyatt','Kaedyn','Greyson','Rhyan','Logan','Trystan'];
const laundry=[
['Myk','Friday night / Saturday morning; one load of towels'],
['Natalie','Saturday afternoon / Sunday; Sunday linens'],
['Kaedyn','Monday; linens and one load of towels'],
['Trystan','Friday morning / day'],
['Wyatt','Tuesday; one load of towels and mats'],
['Smalls','Thursday; dog stuff'],
['Greyson','Wednesday; one load of towels']
];
const areas=[
['Kaedyn & Wyatt','Bedroom, office, hallway, downstairs bathroom'],
['Rhyan','Back room / family room; room (Smalls)'],
['Trystan','Garage, recycling, bedroom (other handwriting unclear)'],
['Greyson','Bedroom, upstairs bathroom, hallway, downstairs side bathroom'],
['Rhyan & Logan','Dining room'],
['Myk','Kitchen, garage, outside deck'],
['Natalie','Bathroom, laundry, hall, mud room']
];
const members=['Logan','Natalie','Wyatt','Kaedyn','Greyson','Rhyan','Trystan','Myk','Smalls'];
let currentUser=localStorage.getItem('chore-current-user')||'';
let loganUnlocked=false;
const pointManagers=['Logan','Myk','Natalie'];let managerUnlocked=false;
let tab='Today';const tabs=['Today','Calendar','Dishes','Laundry','Cleaning','Progress','Rewards'];
let calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1),selectedDate=new Date();
function week(d=new Date()){let s=new Date(d.getFullYear(),d.getMonth(),d.getDate());s.setDate(s.getDate()-s.getDay());return dateKey(s)}
function laundryDays(i){return i===0?['Friday','Saturday']:i===1?['Saturday','Sunday']:[['Friday','Saturday'],['Saturday','Sunday'],['Monday'],['Friday'],['Tuesday'],['Thursday'],['Wednesday']][i]}
function taskDays(t){return t.days|| (t.day?[t.day]:[])}
function tasks(){return [
...days.map((day,i)=>({id:'dish'+i,day,person:dishes[i],name:'Wash dishes'})),
...laundry.map(([person,name],i)=>({id:'laundry'+i,person,name,day:laundryDays(i)[0],days:laundryDays(i)})),
...areas.map(([person,name],i)=>({id:'area'+i,person,name,day:''}))
]}
const key=(d=new Date())=>'chore-checks-'+week(d);
const cloudWeeks={};let cloudReady=false,cloudError='';
function cloudStatus(){return cloudError?'⚠️ Sync unavailable: '+cloudError:cloudReady?'☁️ Live sync connected':'⏳ Connecting to shared chores…'}
function updateCloudStatus(){const e=document.getElementById('sync-status');if(e)e.textContent=cloudStatus()}

function checks(d=new Date()){
 const w=week(d);if(cloudReady&&cloudWeeks[w])return cloudWeeks[w];
 try{return JSON.parse(localStorage.getItem(key(d))||'{}')}catch{return {}}
}
function mark(id,v){
 let d=tab==='Calendar'?selectedDate:new Date(),w=week(d),c={...checks(d)};
 const entry=v?{by:currentUser,at:new Date().toISOString()}:null;
 if(v)c[id]=entry;else delete c[id];
 localStorage.setItem(key(d),JSON.stringify(c));
 if(cloudReady){cloudWeeks[w]=c}
 render();
 if(window.saveCloudChore)window.saveCloudChore(w,id,entry).catch(e=>{cloudError=e.message||String(e);updateCloudStatus()});
}
function taskHTML(t,d=new Date()){
let c=checks(d),entry=c[t.id],who=entry&&typeof entry==='object'&&entry.by?entry.by:'Not recorded (older checkmark)';
let when=entry&&typeof entry==='object'&&entry.at?new Date(entry.at).toLocaleString():'';
return '<label class="task"><input type="checkbox" data-id="'+t.id+'" '+(entry?'checked':'')+'><span class="task-details"><span class="'+(entry?'done':'')+'"><strong>'+escapeHTML(t.person)+'</strong> — '+escapeHTML(t.name)+(t.day?' <small>('+escapeHTML(taskDays(t).join(' / '))+')</small>':'')+'</span>'+(entry?'<span class="completion-credit">✓ Checked off by <strong>'+escapeHTML(who)+'</strong>'+(when?' · '+escapeHTML(when):'')+'</span>':'')+'</span></label>';
}
function section(title,items,empty,d=new Date()){return '<div class="card"><h2>'+title+'</h2>'+(items.length?items.map(t=>taskHTML(t,d)).join(''):'<p><small>'+empty+'</small></p>')+'</div>'}
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function calendarView(all){
const y=calendarMonth.getFullYear(),m=calendarMonth.getMonth(),first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate();
let grid='<div class="calendar-grid">'+days.map(d=>'<div class="calendar-head">'+d.slice(0,3)+'</div>').join('');
for(let i=0;i<first;i++)grid+='<div></div>';
for(let n=1;n<=count;n++){
let d=new Date(y,m,n),day=d.getDay(),k=dateKey(d),selected=k===dateKey(selectedDate),isToday=k===dateKey(new Date());
let dayTasks=all.filter(t=>taskDays(t).includes(days[day])||(day===6&&t.id.startsWith('area')));
grid+='<button class="calendar-day '+(selected?'selected ':'')+(isToday?'is-today':'')+'" data-date="'+k+'"><strong>'+n+'</strong><small>'+dayTasks.filter(t=>t.id.startsWith('dish')).length+' 🍽️ '+dayTasks.filter(t=>t.id.startsWith('laundry')).length+' 🧺'+(day===6?' 🧹':'')+'</small></button>';
}
grid+='</div>';
let selectedDay=days[selectedDate.getDay()],selectedTasks=all.filter(t=>taskDays(t).includes(selectedDay)||(selectedDate.getDay()===6&&t.id.startsWith('area')));
return '<div class="card"><div class="calendar-toolbar"><button data-month="-1" aria-label="Previous month">‹</button><h2>'+calendarMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</h2><button data-month="1" aria-label="Next month">›</button></div>'+grid+'<p><small>🍽️ Dishes · 🧺 Laundry · 🧹 Weekly cleaning deadline · Selected week: '+week(selectedDate)+'</small></p></div>'+section('📅 '+selectedDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}),selectedTasks,'No scheduled chores',selectedDate);
}
function showIdentity(){
const overlay=document.getElementById('identity');overlay.hidden=false;overlay.style.display='flex';
overlay.innerHTML='<div class="identity-panel"><h2>👋 Who is checking in?</h2><p>Choose your name to open the household chore tracker.</p><select id="member-select"><option value="">Select your name</option>'+members.map(n=>'<option value="'+n+'">'+n+'</option>').join('')+'</select><div id="logan-password" hidden><label for="admin-pin">Parent access code</label><input id="admin-pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="Enter 4-digit code" style="width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:1px solid #a8b9c0;border-radius:10px"></div><p id="identity-error" role="alert" style="color:#a32020"></p><button id="enter-app" disabled>Continue</button><p><small>Your name is remembered on this device. This is a basic access screen, not secure authentication.</small></p></div>';
let select=document.getElementById('member-select'),button=document.getElementById('enter-app');
select.onchange=()=>{button.disabled=!select.value;document.getElementById('logan-password').hidden=!pointManagers.includes(select.value);document.getElementById('identity-error').textContent=''};
button.onclick=()=>{if(!select.value)return;
if(pointManagers.includes(select.value)&&document.getElementById('admin-pin').value!==(select.value==='Logan'?'0118':'1111')){document.getElementById('identity-error').textContent='Incorrect access code';return}
managerUnlocked=pointManagers.includes(select.value);loganUnlocked=select.value==='Logan'&&managerUnlocked;currentUser=select.value;
localStorage.setItem('chore-current-user',currentUser);overlay.hidden=true;overlay.style.display='none';tab='Today';render()};
}
let monitorState={last:null,history:[],runs:0};
function auditApp(){
const results=[],add=(name,ok,detail)=>results.push({name,ok,detail});
let all=[],stored={};
try{all=tasks();add('Chore data loads',Array.isArray(all)&&all.length>0,all.length+' assignments found')}catch(e){add('Chore data loads',false,String(e))}
add('Unique task identifiers',new Set(all.map(t=>t.id)).size===all.length,'Prevents checkboxes sharing the same saved state');
add('Daily dishes coverage',days.every(d=>all.filter(t=>t.id.startsWith('dish')&&t.day===d).length===1),'One dish assignment per day');
add('Laundry assignments',laundry.length===7&&laundry.every(x=>x[0]&&x[1]),laundry.length+' laundry assignments configured');
add('Cleaning assignments',areas.length>0&&areas.every(x=>x[0]&&x[1]),areas.length+' cleaning assignments configured');
add('Family name mapping',all.every(t=>t.person.split(' & ').every(n=>members.includes(n))), 'Checks that assigned names exist in the selector');
add('Calendar date calculations',[0,1,2,3,4,5,6].every(i=>days[new Date(2026,10,15+i).getDay()]===days[i]),'Validates weekday mapping');
try{let probe='chore-monitor-probe';localStorage.setItem(probe,'ok');let ok=localStorage.getItem(probe)==='ok';localStorage.removeItem(probe);add('Device storage write/read',ok,'Tests whether local progress can be saved')}catch(e){add('Device storage write/read',false,'Storage unavailable: '+e.message)}
try{stored=checks();add('Saved checkmarks format',stored&&typeof stored==='object'&&!Array.isArray(stored),'Saved weekly progress is readable')}catch(e){add('Saved checkmarks format',false,String(e))}
add('No unknown saved tasks',Object.keys(stored).every(id=>all.some(t=>t.id===id)),'Detects obsolete or mismatched saved IDs');
add('Multi-day laundry coverage',taskDays(all.find(t=>t.id==='laundry0')).includes('Saturday')&&taskDays(all.find(t=>t.id==='laundry1')).includes('Sunday'),'Checks weekend laundry assignments');
add('Calendar week separation',key(new Date(2026,10,15))!==key(new Date(2026,10,22)),'Different calendar weeks have separate saved checkmarks');
add('Navigation tabs present',tabs.includes('Today')&&tabs.includes('Calendar')&&tabs.includes('Progress'),'Checks main navigation configuration');
add('Admin access state',currentUser==='Logan'&&loganUnlocked,'Admin monitor only runs after Logan PIN entry');
const suggestions=[];
const overdue=all.filter(t=>taskDays(t).length&&taskDays(t).every(d=>days.indexOf(d)<new Date().getDay())&&!stored[t.id]).length;
if(overdue)suggestions.push(overdue+' earlier scheduled chore(s) are still unchecked. Consider an overdue summary.');
if(!navigator.onLine)suggestions.push('Device appears offline. Changes will stay on this device only.');
suggestions.push('Progress does not sync between family devices. Add a shared database for household-wide updates.');
suggestions.push('The PIN is stored in public browser code. Use server-side authentication for real admin privacy.');
suggestions.push('Multi-day laundry assignments now appear on both scheduled days. Consider setting exact start and end times.');
suggestions.push('Calendar now saves progress by selected week. Individual daily completion history would require separate per-day records.');
let time=new Date(),report={time:time.toLocaleTimeString(),timestamp:time.toISOString(),results,suggestions,passed:results.filter(x=>x.ok).length,failed:results.filter(x=>!x.ok).length};
monitorState.last=report;monitorState.runs++;
monitorState.history.unshift({time:report.time,passed:report.passed,failed:report.failed});
monitorState.history=monitorState.history.slice(0,12);
return report;
}
function monitorView(){
let r=monitorState.last||auditApp();
return '<div class="card"><h2>🧠 Live App Monitor</h2><p><strong>Monitoring while this app is open</strong> · Automated checks every 30 seconds</p><p><strong>'+r.passed+' passed · '+r.failed+' flagged</strong> out of '+r.results.length+' checks</p><p><small>Last scan: '+escapeHTML(r.time)+' · Scans this session: '+monitorState.runs+'</small></p><button id="scan-now">Run checks now</button></div>'+
'<div class="card"><h2>Function checks</h2>'+r.results.map(x=>'<div class="task"><span>'+(x.ok?'✅':'⚠️')+' <strong>'+escapeHTML(x.name)+'</strong><div><small>'+escapeHTML(x.detail)+'</small></div></span></div>').join('')+'</div>'+
'<div class="card"><h2>💡 Improvement suggestions</h2>'+r.suggestions.map(x=>'<p>• '+escapeHTML(x)+'</p>').join('')+'</div>'+
'<div class="card"><h2>Recent live scans</h2>'+monitorState.history.map(x=>'<div class="task"><small>'+escapeHTML(x.time)+' — '+x.passed+' passed, '+x.failed+' flagged</small></div>').join('')+'</div>'+
'<div class="card"><small>This is a local automated diagnostics engine, not a cloud AI model. It checks known invariants without modifying chores or GitHub. It cannot test every possible interaction, detect every bug, or keep running after the browser closes.</small></div>';
}
function refreshMonitor(){
if(tab==='Logan Only'&&loganUnlocked&&currentUser==='Logan'){
auditApp();const el=document.getElementById('monitor-area');if(el)el.innerHTML=monitorView();
const b=document.getElementById('scan-now');if(b)b.onclick=refreshMonitor;
}}
setInterval(()=>{if(tab==='Logan Only'&&loganUnlocked&&currentUser==='Logan')refreshMonitor()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tab==='Logan Only'&&loganUnlocked&&currentUser==='Logan')refreshMonitor()});

let cloudBonusEntries=null;
function bonusEntries(){if(cloudBonusEntries!==null)return cloudBonusEntries;try{return JSON.parse(localStorage.getItem('chore-bonus-points')||'[]')}catch{return []}}
function bonusId(x){return 'bonus_'+[x.at,x.person,x.by,x.amount,x.reason].join('|').split('').reduce((h,c)=>((h*31+c.charCodeAt(0))>>>0),2166136261).toString(36)}
function pointLedger(name){
 const ledger=[],all=tasks();
 for(let i=0;i<localStorage.length;i++){
  const k=localStorage.key(i);if(!k||!k.startsWith('chore-checks-'))continue;
  try{const c=JSON.parse(localStorage.getItem(k));for(const [id,v] of Object.entries(c)){
   if(v&&typeof v==='object'&&v.by===name){
    const t=all.find(t=>t.id===id),amount=id.startsWith('area')?20:id.startsWith('laundry')?15:10;
    ledger.push({amount,label:t?t.name:'Chore '+id,detail:t?'Assigned to '+t.person:'Saved chore',at:v.at||''});
   }
  }}catch{}
 }
 for(const x of bonusEntries().filter(x=>x.person===name)){
  ledger.push({amount:Number(x.amount)||0,label:x.reason,detail:'Bonus from '+x.by,at:x.at||''});
 }
 for(const x of pointMovements){
 if(x.from===name)ledger.push({amount:-x.amount,label:x.kind==='transfer'?'Sent to '+x.to:'Adult deduction',detail:x.reason+' · by '+x.by,at:x.at});
 if(x.kind==='transfer'&&x.to===name)ledger.push({amount:x.amount,label:'Received from '+x.from,detail:x.reason+' · by '+x.by,at:x.at});
 }
 return ledger.sort((x,y)=>String(y.at).localeCompare(String(x.at)));
}
let pointMovements=[];
function score(name){return pointLedger(name).reduce((n,x)=>n+x.amount,0)}
let pointsNotice='';
async function movePoints(kind){
 const recipient=document.getElementById(kind+'-person').value,amount=Number(document.getElementById(kind+'-amount').value),reason=document.getElementById(kind+'-reason').value.trim();
 if(!members.includes(recipient)||!Number.isInteger(amount)||amount<1||amount>50||!reason){alert('Select a person, 1–50 points, and a reason.');return}
 if(kind==='transfer'&&recipient===currentUser){alert('Choose another person.');return}
 if(kind==='adjust'&&(!managerUnlocked||!pointManagers.includes(currentUser))){alert('Adult approval required.');return}
 const owner=kind==='transfer'?currentUser:recipient;
 if(score(owner)<amount){alert('Insufficient points. Available: '+score(owner));return}
 if(!window.savePointMovement){alert('Cloud sync is not ready.');return}
 const button=document.getElementById(kind+'-submit');button.disabled=true;button.textContent='Saving…';
 try{
 await window.savePointMovement({kind,from:owner,to:kind==='transfer'?recipient:'',amount,reason,by:currentUser,at:new Date().toISOString()});
 pointsNotice=kind==='transfer'?'✅ Successfully transferred '+amount+' points to '+recipient+'.':'✅ Successfully deducted '+amount+' points from '+recipient+'.';
 render();
 }catch(e){alert('Save failed: '+e.message);button.disabled=false;button.textContent=kind==='transfer'?'Transfer points':'Deduct points'}
}
function pointsControls(){
 const options=names=>names.map(n=>'<option value="'+n+'">'+escapeHTML(n)+'</option>').join('');
 const field=(id,label,control)=>'<div class="point-field"><label for="'+id+'">'+label+'</label>'+control+'</div>';
 const form=(kind,title,description,personLabel,people,amountLabel,placeholder,buttonLabel)=>'<div class="card point-form"><h2>'+title+'</h2><p>'+description+'</p>'+
 field(kind+'-person',personLabel,'<select id="'+kind+'-person">'+options(people)+'</select>')+
 field(kind+'-amount',amountLabel,'<input id="'+kind+'-amount" type="number" min="1" max="50" value="5">')+
 field(kind+'-reason','Reason','<input id="'+kind+'-reason" type="text" placeholder="'+placeholder+'" maxlength="120">')+
 '<button id="'+kind+'-submit" type="button">'+buttonLabel+'</button></div>';
 const transfer=form('transfer','↔️ Transfer points','Send points from your balance to someone else.','Recipient',members.filter(n=>n!==currentUser),'Amount','Why are you sending points?','Transfer points');
 const adjust=managerUnlocked&&pointManagers.includes(currentUser)?form('adjust','⚖️ Adult point adjustment','Logan, Natalie, and Myk can deduct points for behavior. The reason and adult name are recorded.','Person',members.filter(n=>!pointManagers.includes(n)),'Amount to deduct','Behavior and reason','Deduct points'):'';
 return (pointsNotice?'<div class="card" role="status" aria-live="polite"><strong>'+escapeHTML(pointsNotice)+'</strong><p>Saved to the shared point history.</p></div>':'')+transfer+adjust;
}
async function awardBonus(){
 if(!managerUnlocked||!pointManagers.includes(currentUser))return;
 const person=document.getElementById('bonus-person').value,amount=Number(document.getElementById('bonus-amount').value),reason=document.getElementById('bonus-reason').value.trim();
 if(!members.includes(person)||pointManagers.includes(person)||!Number.isInteger(amount)||amount<1||amount>50||!reason){alert('Choose a recipient, 1–50 points, and a reason.');return}
 const entry={person,amount,reason,by:currentUser,at:new Date().toISOString()};
 const button=document.getElementById('award-bonus');button.disabled=true;button.textContent='Saving…';
 if(window.saveCloudBonus){
  try{await window.saveCloudBonus(entry);return}catch(e){alert('Cloud save failed: '+(e.message||e));button.disabled=false;button.textContent='Award points';return}
 }
 alert('Cloud is not connected. Please wait for live sync before awarding points.');
 button.disabled=false;button.textContent='Award points';
}
function bonusPanel(){let entries=bonusEntries().slice().sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,10);return '<div class="card"><h2>🌟 Give extra points</h2><p>For helping out, being kind, or doing extra chores.</p><label>Give points to</label><select id="bonus-person">'+members.filter(n=>!pointManagers.includes(n)).map(n=>'<option value="'+n+'">'+n+'</option>').join('')+'</select><label>Points (1–50)</label><input id="bonus-amount" type="number" min="1" max="50" value="10"><label>Reason</label><input id="bonus-reason" maxlength="120" placeholder="e.g. Helped clean the garage"><button id="award-bonus">Award points</button><h3>Recent bonus awards</h3>'+(entries.length?entries.map(x=>'<p><strong>'+escapeHTML(x.person)+'</strong> +'+x.amount+' ⭐ — '+escapeHTML(x.reason)+' <small>from '+escapeHTML(x.by)+'</small></p>').join(''):'<p>No bonus points awarded yet.</p>')+'</div>'}
function rewardsView(){
 const ledger=pointLedger(currentUser),points=ledger.reduce((n,x)=>n+x.amount,0);
 const prizes=[['🎬 Choose movie night',30],['🍦 Pick dessert',50],['🎮 Choose game night',75],['🎉 Pick weekend activity',120]];
 const details=ledger.length?ledger.map(x=>'<div class="task"><div class="task-details" style="flex:1"><strong>'+escapeHTML(x.label)+'</strong><small>'+escapeHTML(x.detail)+(x.at?' · '+escapeHTML(new Date(x.at).toLocaleString()):'')+'</small></div><strong>+'+x.amount+' ⭐</strong></div>').join(''):'<p>No points recorded yet.</p>';
